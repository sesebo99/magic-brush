  <script>
    const FAL_KEY = 'd53c1497-e1e4-44cc-81b3-9ef0186a6930:81384732d2e1bc64637e46d379886080'; // ★ここに取得したAPIキーを貼り付け

    const bgCanvas = document.getElementById('bgCanvas');
    const drawCanvas = document.getElementById('drawCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');
    let isDrawing = false;
    let loadedImage = null;

    function initCanvas() {
      bgCanvas.width = drawCanvas.width = drawCanvas.offsetWidth;
      bgCanvas.height = drawCanvas.height = drawCanvas.offsetHeight;
    }
    window.onload = initCanvas;

    // 画像読み込み
    document.getElementById('imageInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          initCanvas();
          bgCtx.drawImage(img, 0, 0, bgCanvas.width, bgCanvas.height);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 指でなぞってマスク描画
    drawCanvas.addEventListener('touchstart', (e) => { isDrawing = true; draw(e); });
    drawCanvas.addEventListener('touchmove', (e) => { draw(e); });
    drawCanvas.addEventListener('touchend', () => { isDrawing = false; drawCtx.beginPath(); });

    function draw(e) {
      if (!isDrawing) return;
      const rect = drawCanvas.getBoundingClientRect();
      const touch = e.touches[0];
      drawCtx.lineWidth = 30;
      drawCtx.lineCap = 'round';
      drawCtx.strokeStyle = 'white'; // マスクは白にする方が安定します
      drawCtx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
      drawCtx.stroke();
      drawCtx.beginPath();
      drawCtx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
    }

    function clearMask() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    }

    // AI書き換え処理の実行
    async function runInpaint() {
      const prompt = document.getElementById('promptInput').value;
      const status = document.getElementById('status');
      if (!loadedImage || !prompt) {
        alert('画像と書き換え用のテキストを入力してください');
        return;
      }

      status.innerText = 'AIが書き換え処理中... (数秒かかります)';

      try {
        // 白黒マスク画像の作成
        const maskExportCanvas = document.createElement('canvas');
        maskExportCanvas.width = bgCanvas.width;
        maskExportCanvas.height = bgCanvas.height;
        const mCtx = maskExportCanvas.getContext('2d');
        mCtx.fillStyle = 'black';
        mCtx.fillRect(0, 0, maskExportCanvas.width, maskExportCanvas.height);
        mCtx.drawImage(drawCanvas, 0, 0);

        const response = await fetch('https://fal.run/fal-ai/fast-sdxl/inpainting', {
          method: 'POST',
          headers: {
            'Authorization': `Key ${FAL_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            image_url: bgCanvas.toDataURL('image/jpeg', 0.8),
            mask_url: maskExportCanvas.toDataURL('image/png'),
            prompt: prompt,
            sync_mode: true
          })
        });

        const data = await response.json();
        
        if (data.images && data.images[0]) {
          const resultImg = new Image();
          resultImg.crossOrigin = 'anonymous';
          resultImg.onload = () => {
            bgCtx.drawImage(resultImg, 0, 0, bgCanvas.width, bgCanvas.height);
            clearMask();
            status.innerText = '完了しました！';
          };
          resultImg.src = data.images[0].url;
        } else {
          console.log('Error details:', data);
          status.innerText = 'エラーが発生しました。APIキーまたは残高を確認してください。';
        }
      } catch (err) {
        console.error(err);
        status.innerText = '通信エラーが発生しました。';
      }
    }
  </script>
