<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マジックブラシ</title>
  <style>
    body { margin: 0; background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 10px; }
    #editor { position: relative; width: 90vw; height: 50vh; margin: 10px auto; background: #222; border-radius: 8px; overflow: hidden; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
    .controls { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    input[type="text"] { width: 80%; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
    button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 20px; font-weight: bold; }
    #status { margin-top: 10px; font-size: 0.9rem; color: #aaa; }
  </style>
</head>
<body>
  <h2>マジックブラシ</h2>
  
  <div id="editor">
    <canvas id="bgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
  </div>

  <div class="controls">
    <input type="file" id="imageInput" accept="image/*">
    <input type="text" id="promptInput" placeholder="書き換える内容（英語: a red cat など）">
    <button onclick="runInpaint()">書き換え実行</button>
    <button onclick="clearMask()" style="background:#555;">塗りつぶしクリア</button>
  </div>
  <div id="status"></div>

  <script>
    const FAL_KEY = '1a7d34ec-9151-4ee0-b795-97cd60c120dd:1d140a0c379543e1830f53a040f368a5'; // ★ここに取得したAPIキーを貼り付け

    const bgCanvas = document.getElementById('bgCanvas');
    const drawCanvas = document.getElementById('drawCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');
    let isDrawing = false;
    let loadedImage = null;

    function initCanvas() {
      bgCanvas.width = drawCanvas.width = drawCanvas.offsetWidth;
      bgCanvas.height = drawCanvas.height = drawCanvas.offsetHeight;
    }
    window.onload = initCanvas;

    // 画像読み込み
    document.getElementById('imageInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          initCanvas();
          bgCtx.drawImage(img, 0, 0, bgCanvas.width, bgCanvas.height);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 指でなぞってマスク描画
    drawCanvas.addEventListener('touchstart', (e) => { isDrawing = true; draw(e); });
    drawCanvas.addEventListener('touchmove', (e) => { draw(e); });
    drawCanvas.addEventListener('touchend', () => { isDrawing = false; drawCtx.beginPath(); });

    function draw(e) {
      if (!isDrawing) return;
      const rect = drawCanvas.getBoundingClientRect();
      const touch = e.touches[0];
      drawCtx.lineWidth = 30;
      drawCtx.lineCap = 'round';
      drawCtx.strokeStyle = 'rgba(255, 0, 0, 0.7)';
      drawCtx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
      drawCtx.stroke();
      drawCtx.beginPath();
      drawCtx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
    }

    function clearMask() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    }

    // AI書き換え処理の実行
    async function runInpaint() {
      const prompt = document.getElementById('promptInput').value;
      const status = document.getElementById('status');
      if (!loadedImage || !prompt) {
        alert('画像と書き換え用のテキスト（英語）を入力してください');
        return;
      }

      status.innerText = 'AIが書き換え処理中... (数秒かかります)';

      try {
        const response = await fetch('https://fal.run/fal-ai/flux-general/inpainting', {
          method: 'POST',
          headers: {
            'Authorization': `Key ${FAL_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            image_url: bgCanvas.toDataURL('image/jpeg'),
            mask_url: drawCanvas.toDataURL('image/png'),
            prompt: prompt
          })
        });

        const data = await response.json();
        if (data.images && data.images[0]) {
          const resultImg = new Image();
          resultImg.onload = () => {
            bgCtx.drawImage(resultImg, 0, 0, bgCanvas.width, bgCanvas.height);
            clearMask();
            status.innerText = '完了しました！';
          };
          resultImg.src = data.images[0].url;
        } else {
          status.innerText = 'エラーが発生しました。APIキーやプロンプトを確認してください。';
        }
      } catch (err) {
        console.error(err);
        status.innerText = '通信エラーが発生しました。';
      }
    }
  </script>
</body>
</html>
