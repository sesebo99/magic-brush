<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; text-align: center; background: #222; color: #fff; font-family: sans-serif; }
    #canvas-container { position: relative; width: 100vw; height: 60vh; touch-action: none; }
    canvas { position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <h3>マジックブラシ (自分専用)</h3>
  <div id="canvas-container">
    <canvas id="photoCanvas"></canvas>
    <canvas id="maskCanvas"></canvas>
  </div>
  <input type="file" id="upload" accept="image/*"><br><br>
  <input type="text" id="prompt" placeholder="書き換える内容（英語: a red cat など）"><br><br>
  <button onclick="runInpaint()">書き換え実行</button>

  <script>
    // タッチ操作（指でなぞる）でマスクを描く処理をJSで実装
    const maskCanvas = document.getElementById('maskCanvas');
    const ctx = maskCanvas.getContext('2d');
    let isDrawing = false;

    maskCanvas.addEventListener('touchstart', (e) => { isDrawing = true; draw(e); });
    maskCanvas.addEventListener('touchmove', (e) => { draw(e); });
    maskCanvas.addEventListener('touchend', () => { isDrawing = false; ctx.beginPath(); });

    function draw(e) {
      if (!isDrawing) return;
      const touch = e.touches[0];
      const rect = maskCanvas.getBoundingClientRect();
      ctx.lineWidth = 20;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
      ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
    }
    
    // API送信処理 ...
  </script>
</body>
</html>
